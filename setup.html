<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebAR QR Generator</title><link rel="stylesheet" href="style.css?v=5"></head>
<body><main><nav>WEBAR / QR SETUP</nav><h1>Generate your AR QR</h1><div class="panel noprint"><label for="url">Published HTTPS WebAR page URL</label><input id="url" type="url" placeholder="https://yourdomain.com/ar-carousel/"><button id="generate">Generate QR</button><button id="print">Print QR</button><p id="notice" role="status">Enter your published HTTPS WebAR URL.</p></div><h2>Scan this QR with your phone</h2><div id="qr"></div><p id="destination"></p><p>Scan the QR, tap Start AR, allow camera access, find a flat surface, then tap to place the single WebP artwork.</p><small>Requires HTTPS and a browser/device with WebXR Surface AR support.</small></main><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="setup.js?v=5"></script></body></html>
